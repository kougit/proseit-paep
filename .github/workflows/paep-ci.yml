# PAEP CI - IB0-WP05 automated quality gates, extended by IB1 (contracts and runtime configuration)
# and IB2 (design foundations, components and UI laboratory).
# Design: docs/architecture/IB0-WP05-CI-DESIGN.md. Policy checked by
# tooling/verification/verify-ib0-wp05.mjs against tooling/verification/ib0-wp05-ci-policy.json.
# Security rules: pull_request only (never pull_request_target), read-only token,
# no secrets, credentials not persisted, actions pinned to full commit SHAs, and
# no ${{ }} expression inside any run script (values reach scripts through env).
name: PAEP CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paep-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: PAEP / governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Governance and integrity gate
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate governance 2>&1 | tee "$PAEP_EVIDENCE_DIR/governance-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-governance-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  provenance:
    name: PAEP / security-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Workflow security, action pinning, install-script and lockfile provenance gate
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate provenance 2>&1 | tee "$PAEP_EVIDENCE_DIR/provenance-1.log"

      - name: Registry signatures and provenance attestations (npm audit signatures)
        run: |
          set -euo pipefail
          npm audit signatures 2>&1 | tee "$PAEP_EVIDENCE_DIR/provenance-2.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-provenance-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  architecture:
    name: PAEP / architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Architecture boundaries (qa:architecture)
        run: |
          set -euo pipefail
          npm run qa:architecture 2>&1 | tee "$PAEP_EVIDENCE_DIR/architecture-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-architecture-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  strictness:
    name: PAEP / strictness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Strict TypeScript and template type-check (qa:types)
        run: |
          set -euo pipefail
          npm run qa:types 2>&1 | tee "$PAEP_EVIDENCE_DIR/strictness-1.log"

      - name: Strict configuration gate
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate strictness 2>&1 | tee "$PAEP_EVIDENCE_DIR/strictness-2.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-strictness-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  negative-architecture:
    name: PAEP / negative-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Architecture and strictness negative suites
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate negative-architecture 2>&1 | tee "$PAEP_EVIDENCE_DIR/negative-architecture-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-negative-architecture-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  negative-ci:
    name: PAEP / negative-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: CI-control negative tests, part a of 3 (qa:ib0-wp05:negative --part a)
        run: |
          set -euo pipefail
          npm run qa:ib0-wp05:negative -- --part a 2>&1 | tee "$PAEP_EVIDENCE_DIR/negative-ci-1.log"

      - name: Baseline-governance positive, negative and promotion tests (qa:baseline:negative)
        run: |
          set -euo pipefail
          npm run qa:baseline:negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/negative-ci-2.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-negative-ci-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  # IB2 CI-performance split (PO/SA, 2026-09-28): the other half of the unchanged IB0-WP05 negative suite runs in
  # parallel with PAEP / negative-ci, so neither job carries the whole suite on the critical path (RR14).
  negative-ci-b:
    name: PAEP / negative-ci-b
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: CI-control negative tests, part b of 3 (qa:ib0-wp05:negative --part b)
        run: |
          set -euo pipefail
          npm run qa:ib0-wp05:negative -- --part b 2>&1 | tee "$PAEP_EVIDENCE_DIR/negative-ci-b-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-negative-ci-b-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  # Three-way split (PO/SA, 2026-10-07): the third part of the same WP05 negative suite, by its explicit PARTITION,
  # so every part keeps headroom under the unchanged 20-minute timeout.
  negative-ci-c:
    name: PAEP / negative-ci-c
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: CI-control negative tests, part c of 3 (qa:ib0-wp05:negative --part c)
        run: |
          set -euo pipefail
          npm run qa:ib0-wp05:negative -- --part c 2>&1 | tee "$PAEP_EVIDENCE_DIR/negative-ci-c-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-negative-ci-c-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  regression:
    name: PAEP / regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB0-WP01 to IB0-WP04 regression
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate regression 2>&1 | tee "$PAEP_EVIDENCE_DIR/regression-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-regression-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  contracts:
    name: PAEP / contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB1 contracts - independent compile, public API, neutrality and test doubles (qa:contracts)
        run: |
          set -euo pipefail
          npm run qa:contracts 2>&1 | tee "$PAEP_EVIDENCE_DIR/contracts-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-contracts-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  runtime-config:
    name: PAEP / runtime-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB1 runtime configuration - schema, generated validator, positive and negative tests (qa:runtime-config)
        run: |
          set -euo pipefail
          npm run qa:runtime-config 2>&1 | tee "$PAEP_EVIDENCE_DIR/runtime-config-1.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-runtime-config-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  runtime-config-negative:
    name: PAEP / runtime-config-negative
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB1 runtime-config mutation tests (qa:runtime-config:negative)
        run: |
          set -euo pipefail
          npm run qa:runtime-config:negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/runtime-config-negative-1.log"

      - name: IB1 same-build portability and fail-safe startup proof (qa:runtime-config:portability)
        run: |
          set -euo pipefail
          npm run qa:runtime-config:portability 2>&1 | tee "$PAEP_EVIDENCE_DIR/runtime-config-negative-2.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-runtime-config-negative-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  components:
    name: PAEP / components
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB2 foundation and component behaviour tests in Chrome (test:components)
        run: |
          set -euo pipefail
          npm run test:components 2>&1 | tee "$PAEP_EVIDENCE_DIR/components-1.log"

      - name: IB2 design-system static gate - handoff, tokens, census, styling, imports, clean-room, lab coverage (qa:design-system)
        run: |
          set -euo pipefail
          npm run qa:design-system 2>&1 | tee "$PAEP_EVIDENCE_DIR/components-2.log"

      - name: IB2 design-system negative suite (qa:design-system:negative)
        run: |
          set -euo pipefail
          npm run qa:design-system:negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/components-3.log"

      - name: IB2 CI-governance negative suite - IB2 jobs mandatory, IB2 regression bounds narrow (qa:ib2:ci-negative)
        run: |
          set -euo pipefail
          npm run qa:ib2:ci-negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/components-4.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-components-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  accessibility:
    name: PAEP / accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Production build (ui-lab) for browser QA
        run: |
          set -euo pipefail
          npm run build:ui-lab 2>&1 | tee "$PAEP_EVIDENCE_DIR/accessibility-1.log"

      - name: IB2 axe-core, 320/834/1440 px, RTL, reduced motion, density, brand and focus checks (qa:accessibility)
        run: |
          set -euo pipefail
          npm run qa:accessibility 2>&1 | tee "$PAEP_EVIDENCE_DIR/accessibility-2.log"

      - name: IB2 accessibility negative suite (qa:accessibility:negative)
        run: |
          set -euo pipefail
          npm run qa:accessibility:negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/accessibility-3.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-accessibility-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  build-reference-app:
    name: PAEP / build-reference-app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Production build (reference-app)
        run: |
          set -euo pipefail
          npm run build:reference-app 2>&1 | tee "$PAEP_EVIDENCE_DIR/build-reference-app-1.log"

      - name: Build metadata
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate build-metadata --app reference-app 2>&1 | tee "$PAEP_EVIDENCE_DIR/build-reference-app-2.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-build-reference-app-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  build-ui-lab:
    name: PAEP / build-ui-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Production build (ui-lab)
        run: |
          set -euo pipefail
          npm run build:ui-lab 2>&1 | tee "$PAEP_EVIDENCE_DIR/build-ui-lab-1.log"

      - name: Build metadata
        run: |
          set -euo pipefail
          node tooling/verification/verify-ib0-wp05.mjs --gate build-metadata --app ui-lab 2>&1 | tee "$PAEP_EVIDENCE_DIR/build-ui-lab-2.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-build-ui-lab-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  # IB3-ENTERPRISE-SHELL (authorising instruction section 17): the enterprise-shell behaviour tests, static gate and seeded
  # negatives, and the IB3 CI-governance negative; then the reference-app browser gate. Both feed PAEP / gate.
  enterprise-shell:
    name: PAEP / enterprise-shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB3 enterprise-shell behaviour tests in Chrome (test:enterprise)
        run: |
          set -euo pipefail
          npm run test:enterprise 2>&1 | tee "$PAEP_EVIDENCE_DIR/enterprise-shell-1.log"

      - name: IB3 enterprise-shell static gate - scope, imports, public API, messages, security, routes (qa:enterprise)
        run: |
          set -euo pipefail
          npm run qa:enterprise 2>&1 | tee "$PAEP_EVIDENCE_DIR/enterprise-shell-2.log"

      - name: IB3 enterprise-shell and design-system extension negative suites (qa:enterprise:negative)
        run: |
          set -euo pipefail
          npm run qa:enterprise:negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/enterprise-shell-3.log"

      - name: IB3 CI-governance negative suite - IB3 jobs mandatory, IB3 regression bounds narrow (qa:ib3:ci-negative)
        run: |
          set -euo pipefail
          npm run qa:ib3:ci-negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/enterprise-shell-4.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-enterprise-shell-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  shell-browser:
    name: PAEP / shell-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: Production build (reference-app) for the shell browser gate
        run: |
          set -euo pipefail
          npm run build:reference-app 2>&1 | tee "$PAEP_EVIDENCE_DIR/shell-browser-1.log"

      - name: IB3 shell browser gate - 1440 to 320x256 px, LTR and RTL, axe-core, keyboard, focus, reduced motion (qa:shell)
        run: |
          set -euo pipefail
          npm run qa:shell 2>&1 | tee "$PAEP_EVIDENCE_DIR/shell-browser-2.log"

      - name: IB3 shell browser negative suite (qa:shell:negative)
        run: |
          set -euo pipefail
          npm run qa:shell:negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/shell-browser-3.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-shell-browser-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  frappe-adapter:
    name: PAEP / frappe-adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for baseline comparisons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PAEP setup
        uses: ./.github/actions/paep-setup

      - name: IB4 Frappe adapter suite - unit, session/CSRF, records, workflow, files, errors, concurrency, compatibility, freshness, security negatives (qa:frappe)
        run: |
          set -euo pipefail
          npm run qa:frappe 2>&1 | tee "$PAEP_EVIDENCE_DIR/frappe-adapter-1.log"

      - name: IB4 fixture conformance against the recorded pmra-api-v1 backend (qa:integration)
        run: |
          set -euo pipefail
          npm run qa:integration 2>&1 | tee "$PAEP_EVIDENCE_DIR/frappe-adapter-2.log"

      - name: IB4 CI-governance negative suite - frappe-adapter job mandatory (qa:ib4:ci-negative)
        run: |
          set -euo pipefail
          npm run qa:ib4:ci-negative 2>&1 | tee "$PAEP_EVIDENCE_DIR/frappe-adapter-3.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paep-frappe-adapter-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paep-evidence/
          if-no-files-found: warn
          retention-days: 30

  gate:
    name: PAEP / gate
    if: ${{ always() }}
    needs:
      - governance
      - provenance
      - architecture
      - strictness
      - negative-architecture
      - negative-ci
      - regression
      - contracts
      - runtime-config
      - runtime-config-negative
      - components
      - accessibility
      - negative-ci-b
      - build-reference-app
      - build-ui-lab
      - enterprise-shell
      - shell-browser
      - negative-ci-c
      - frappe-adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate every mandatory job result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MANDATORY_JOBS: governance provenance architecture strictness negative-architecture negative-ci regression contracts runtime-config runtime-config-negative components accessibility negative-ci-b build-reference-app build-ui-lab enterprise-shell shell-browser negative-ci-c frappe-adapter
        run: |
          set -euo pipefail
          fail=0
          actual="$(jq -r 'keys[]' <<<"$NEEDS_JSON" | sort | tr '\n' ' ')"
          expected="$(tr ' ' '\n' <<<"$MANDATORY_JOBS" | sed '/^$/d' | sort | tr '\n' ' ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=PAEP gate::needs [$actual] differ from the mandatory jobs [$expected]"
            fail=1
          fi
          for job in $MANDATORY_JOBS; do
            result="$(jq -r --arg job "$job" '.[$job].result // "missing"' <<<"$NEEDS_JSON")"
            echo "$job: $result"
            echo "| $job | $result |" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if [ "$result" != "success" ]; then
              echo "::error title=PAEP gate::mandatory job $job finished with result '$result'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "PAEP gate: FAIL"
            exit 1
          fi
          echo "PAEP gate: PASS"
