tokenMap:
  document: foundation/token-values.md
  data: foundation/token-values.candidate.json
  prototypeCss: foundation/prototype-reference.css (reference only)
  layers:
    ref: --paep-ref-*
    semantic: --paep-color-*, --paep-space-*, --paep-font-*, --paep-radius-*, --paep-elevation-*, --paep-motion-*, --paep-size-*, --paep-density-*, --paep-focus-*, --paep-layout-*
    brandOverridable:
    - --paep-brand-primary
    - --paep-brand-primary-hover
    - --paep-brand-primary-active
    - --paep-brand-primary-subtle
    - --paep-brand-on-primary
    - --paep-brand-accent
    - --paep-brand-on-accent
    brandDerived:
      --paep-color-selected-bg: --paep-brand-primary-subtle
      --paep-color-selected-fg: --paep-brand-primary
      --paep-color-selected-indicator: --paep-brand-primary
      --paep-color-link: --paep-brand-primary
      progressFill: --paep-brand-primary
    brandUsageRules:
    - brand-accent (gold) is emphasis only and always carries on-brand-accent (dark) text
    - white on brand-accent is prohibited (2.26:1)
    - brand-accent as text or indicator on light surfaces is prohibited (2.26:1)
    - brand-accent is never used in status-like shapes (badges, alerts, status icons)
    - profiles must not override success, warning, error, information, focus, invalid, disabled or accessibility-contrast semantics
  protected:
  - --paep-color-status-*
  - --paep-color-focus-*
  - --paep-color-disabled-*
  - --paep-color-text-*
  - --paep-color-invalid-*
  - --paep-color-readonly-*
  - --paep-color-border-default
  - --paep-color-surface*
  - --paep-color-bg-page
  - --paep-color-scrim
  brandProfiles:
    proseit-default:
      source: PO/SA direction 2026-09-27 (primary and accent); tonal variants CANDIDATE
      primary: '#24364B'
      primaryHover: '#1B2A3B'
      primaryActive: '#121E2B'
      primarySubtle: '#E7ECF2'
      onPrimary: '#FFFFFF'
      accent: '#D4A62A'
      onAccent: '#1A1F26'
      contrast: on-primary 12.32:1 PASS; on-accent 7.32:1 PASS
    synthetic-demo-petrol:
      source: SYNTHETIC, non-product demonstration only; not a ProSEIT value and not the ProSEIT default
      primary: '#0B5E73'
      primaryHover: '#094C5E'
      primaryActive: '#073C4A'
      primarySubtle: '#E4F1F4'
      onPrimary: '#FFFFFF'
      accent: '#9ED6E0'
      onAccent: '#1A1F26'
      contrast: on-primary 7.34:1 PASS; on-accent 10.37:1 PASS
    rejectedDemonstrations:
    - rejected-demo-yellow (yellow #E9B308 with white text, 1.92:1)
    - white on gold (2.26:1)
    - override of a protected status token
  contrastEvidence: foundation/token-values.md §1.7 (59 pairs; 54 required, 54 PASS, 0 FAIL; 2 exempt met; 2 prohibited combinations excluded by rule; 1 informational)
  density:
    default: comfortable
    alternate: compact
  darkTheme: not in IB2
