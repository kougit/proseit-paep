deviations: []
outOfScope:
- backend search/notification/identity/permission/entitlement contracts and services
- login and real session flows
- offline queue, replay, service worker, conflict engine, sync authority
- analytics datasets, reporting gateways, metrics, drill-down, saved views, report persistence
- preference persistence
- runtime-config schema change
- secondary entry points
- new dependencies
- domain content
- Angular production code
- Toast (Q-08 decision)
- Tooltip
- paep-contracts changes
openDecisions: []
designDecisions:
- id: Q-01
  question: Topbar surface
  status: RESOLVED
  resolution: 'A: light topbar'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-01)
- id: Q-02
  question: Governed menu/positioning base
  status: RESOLVED
  resolution: 'A: extend PaepPopover with inline-start/inline-end alignment, keeping the governed flip/shift positioning and the accepted 16 px viewport edge margin (RD-01); PaepMenu is the reusable menu
    interaction component composed on that base, not a second positioning engine; rebuild the action-group overflow on that base where technically compatible. Changes accepted IB2 design intent: HOF-IB2-001
    v1.2 must incorporate it before affected component code lands'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-02)
- id: Q-03
  question: Collapsed navigation form
  status: RESOLVED
  resolution: 'A: 5.5 rem collapsed rail with visible authored short labels and link flyouts'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-03)
- id: Q-04
  question: Notifications container
  status: RESOLVED
  resolution: 'A, governed by RD-02: non-modal inset panel anchored from the notification control, max inline size 24 rem, constrained to the viewport with the normal 16 px shell edge margin; not full screen'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-04)
- id: Q-05
  question: Palette grouping / empty query / locked results
  status: RESOLVED
  resolution: 'A: Go to / Actions / Records groups; explanatory locked results may be shown; truly denied results omitted'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-05)
- id: Q-06
  question: Connectivity at narrow widths
  status: RESOLVED
  resolution: 'A: non-online states always visible; ordinary Online may be hidden below 600 px'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-06)
- id: Q-07
  question: Tenant name below 600 px
  status: RESOLVED
  resolution: 'A: page-header context line and navigation sheet'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-07)
- id: Q-08
  question: Toast
  status: RESOLVED
  resolution: 'A: no Toast component in IB3; announcer/live region + inline alert'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-08)
- id: Q-09
  question: Mobile navigation container
  status: RESOLVED
  resolution: 'A: inline-start modal navigation sheet, 20 rem maximum and viewport-constrained (effectively full width where the narrow viewport requires it); paep-drawer is not used as application navigation'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-09)
- id: Q-10
  question: Permission-denied navigation items
  status: RESOLVED
  resolution: 'A: hidden; a direct link shows the explanatory locked/unavailable experience'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-10)
- id: Q-11
  question: Context presentation / switcher
  status: RESOLVED
  resolution: 'A: context always visible; switch affordance only with multiple contexts; switching is an explicit request'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-11)
- id: Q-12
  question: Palette keyboard shortcut
  status: RESOLVED
  resolution: 'A: Ctrl/Cmd+K plus the always-available visible trigger'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-12)
- id: Q-13
  question: Locked-state tones
  status: RESOLVED
  resolution: 'A: existing neutral/info semantic tones; no new tone'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-13)
- id: Q-14
  question: Chrome density
  status: RESOLVED
  resolution: 'A: comfortable shell chrome; content density independent'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (Q-14)
- id: X-01
  question: Rail short label
  status: RESOLVED
  resolution: 'APPROVED: optional authored shortLabel; a label is never automatically truncated or hyphenated into a short label; the full label remains the accessible name'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (X-01)
- id: X-02
  question: Narrow status stack
  status: RESOLVED
  resolution: 'APPROVED: top status + "n more"; the summary exposes an accessible, obvious mechanism to inspect the remaining statuses and never conceals a critical state permanently'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (X-02)
- id: X-03
  question: Status ordering
  status: RESOLVED
  resolution: 'APPROVED: 1 impersonation, 2 connectivity, 3 session, 4 environment'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (X-03)
- id: X-04
  question: RTL fixtures
  status: RESOLVED
  resolution: 'APPROVED: Arabic/Hebrew design fixtures are valid for mechanical RTL qualification; native-language copy review mandatory BEFORE IB3 ACCEPTANCE'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (X-04)
- id: X-05
  question: Active language location (REQ-IB3-SHELL-07)
  status: RESOLVED
  resolution: 'OPTION B: with more than one locale, an explicit language (globe) control in the topbar; it may move into an account/overflow surface at narrow widths (design: account menu below 600 px);
    its accessible and visible labelling communicates the active locale; the direction (LTR/RTL) is not required as ordinary topbar text'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (X-05)
- id: RD-01
  question: PaepPopover viewport edge margin
  status: RESOLVED
  resolution: 'APPROVED: retain the accepted 16 px margin; not 8 px'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (RD-01)
- id: RD-02
  question: Notification panel form and width
  status: RESOLVED
  resolution: 'APPROVED: non-modal inset panel, max inline size 24 rem, viewport-constrained with the normal shell edge margin; not a full-screen experience'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (RD-02)
- id: RD-03
  question: Official similarity record
  status: RESOLVED
  resolution: 'APPROVED: the region-by-region human similarity-review form (provenance/similarity-review.md) is the official record'
  resolvedBy: PO/SA (Kouga)
  resolvedDate: '2026-10-05'
  record: decision-record.md (RD-03)
