approvedTokens:
- name: --paep-shell-topbar-block-size
  value: 3.5rem
  rationale: 40 px target + padding; sticky chrome height
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-shell-sidebar-inline-size
  value: 16rem
  rationale: expanded navigation
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-shell-rail-inline-size
  value: 5.5rem
  rationale: collapsed rail with visible labels (Q-03)
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-shell-sheet-inline-size
  value: 20rem
  rationale: mobile navigation container 600-1023 px (Q-09)
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-shell-status-block-size
  value: 2.5rem
  rationale: status row minimum
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-shell-sticky-offset
  value: calc(topbar + --paep-space-2)
  rationale: scroll-padding for WCAG 2.4.11
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-layer-sticky
  value: '30'
  rationale: sticky topbar; collapsed rail column
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-layer-flyout
  value: '40'
  rationale: collapsed-rail group flyout
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-layer-popup
  value: '45'
  rationale: topbar menus and panels; implementation uses the top layer, this is the fallback value
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-layer-overlay-scrim
  value: '60'
  rationale: scrim behind modal overlays
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-layer-overlay
  value: '61'
  rationale: navigation sheet, command palette, dialogs
  status: APPROVED (design intent, PO/SA 2026-10-05)
- name: --paep-layer-skip-link
  value: '80'
  rationale: skip link when focused
  status: APPROVED (design intent, PO/SA 2026-10-05)
approvedTokensRule: Each --paep-layer-* value is attached to its reviewed semantic layer purpose; not an arbitrary numeric z-index ladder. No new colour or tone.
